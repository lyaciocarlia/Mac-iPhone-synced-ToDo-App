name: TodoSync
options:
  bundleIdPrefix: com.lyaciocarlia.todosync
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  createIntermediateGroups: true

packages:
  TodoCore:
    path: TodoCore

targets:
  TodoSync-iOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Apps/iOS
    dependencies:
      - package: TodoCore
    settings:
      base:
        PRODUCT_NAME: TodoSync
        PRODUCT_BUNDLE_IDENTIFIER: com.lyaciocarlia.todosync.ios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TodoSync
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  TodoSync-macOS:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Apps/macOS
    dependencies:
      - package: TodoCore
    settings:
      base:
        PRODUCT_NAME: TodoSync
        PRODUCT_BUNDLE_IDENTIFIER: com.lyaciocarlia.todosync.macos
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TodoSync
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/TodoSync.entitlements
